# pre-commit run --all-files   (install once: pre-commit install)
# Every hook is pinned to a commit SHA ("# frozen" = the tag it corresponds to); update with
# `pre-commit autoupdate --freeze`. The same checks run again in CI (.github/workflows/ci.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig allows comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Same version as backend/uv.lock, so local and CI formatting agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 80c8033123f6d6b9ccd1a9458562ea4180742af7 # frozen: v1.109.2
    hooks:
      - id: terraform_fmt

  # Same Prettier version as frontend/package.json; uses frontend/.prettierrc.json and .prettierignore.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|dist/|node_modules/)
