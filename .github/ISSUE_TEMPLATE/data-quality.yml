name: Data-quality report
description: A number on Stopwatch looks wrong (delay, on-time %, headway, coverage, missing data).
title: "data: "
labels: [data-quality]
body:
  - type: markdown
    attributes:
      value: |
        Stopwatch publishes unofficial estimates inferred from MBTA real-time feeds. Reports like this
        are how we find inference bugs and feed quirks. See docs/methodology.md for definitions.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://.../s/mbta/64 or /r/mbta/1
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: Route, stop, direction, day type and hour
      placeholder: Route 1, Mass Ave @ Newbury St, inbound, weekdays 08:00
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What Stopwatch shows vs. what you believe is right
      description: Include your evidence (your own observations, MBTA alerts, LAMP data, ...).
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Data build id
      description: Shown in the page footer / data health page (manifest build_id), if you can see it.
      placeholder: 20261019T081502Z
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Implausible delay / on-time numbers
        - Missing or stale data (gap, "data delayed" banner)
        - Wrong stop, route or direction information
        - Coverage looks too low or too high
        - Other
    validations:
      required: true
