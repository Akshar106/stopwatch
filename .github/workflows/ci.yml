# Every pull request and every push to main (docs/06 §2). All jobs must pass before merge.
# Third-party actions are pinned to full commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.22"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.16.4"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stopwatch_owner
          POSTGRES_PASSWORD: owner-local-only # throwaway CI credentials, same as compose.yaml
          POSTGRES_DB: stopwatch
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stopwatch_owner -d stopwatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DB_ADMIN_URL: postgresql://stopwatch_owner:owner-local-only@localhost:5433/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Create database roles (scripts/db/init-local.sql)
        env:
          PGPASSWORD: owner-local-only
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql -h localhost -p 5433 -U stopwatch_owner -d stopwatch -v ON_ERROR_STOP=1 -f ../scripts/db/init-local.sql

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Module boundaries (import-linter)
        run: uv run lint-imports

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (unit, property, replay, integration, API)
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml -q

      - name: Migrations round-trip on an empty database (docs/06 §5)
        env:
          DATABASE_OWNER_URL: postgresql://stopwatch_owner:owner-local-only@localhost:5433/stopwatch
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    name: Frontend (lint, types, unit, build, bundle size)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle-size budget (initial JS < 200 KB gzip)
        run: npm run size

  lighthouse:
    name: Lighthouse budgets (mocked preview, mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI (frontend/lighthouserc.json)
        run: npm run lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright + axe
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  iac:
    name: Infrastructure as code (fmt, validate, tflint, Checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform init + validate (every root)
        run: |
          for root in infra/bootstrap infra/envs/staging infra/envs/prod; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: Staging and prod roots stay identical
        run: diff -u infra/envs/staging/main.tf infra/envs/prod/main.tf

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limits only
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl" --format=compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: infra
          framework: terraform
          output_format: cli
          quiet: true
          compact: true
          download_external_modules: false

  security:
    name: Security (secrets, dependencies, SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="--all" .

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: pip-audit (locked runtime dependencies, all extras)
        working-directory: backend
        run: |
          uv export --frozen --all-extras --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: OSV-Scanner (uv.lock, package-lock.json)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=backend/uv.lock
            --lockfile=frontend/package-lock.json

      - name: Semgrep (registry + custom rules)
        run: |
          uvx --from semgrep==1.181.0 semgrep scan --error --metrics=off \
            --config p/python --config p/typescript --config p/secrets \
            --config .semgrep/stopwatch.yml \
            --exclude research --exclude "*/node_modules/*" --exclude "backend/tests" --exclude "frontend/tests"
