# Weekly checks against staging (docs/06 §1, §7): k6 load test at the documented rates and an
# OWASP ZAP baseline scan (findings are filed as a GitHub issue, not a failed build).
# Set the repository variable STAGING_URL (e.g. https://dxxxx.cloudfront.net) to enable.
name: Weekly

on:
  schedule:
    - cron: "41 9 * * 1" # Mondays 09:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: k6 load test (staging)
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      - uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        with:
          path: tests/load/k6.js
          flags: --env BASE_URL=${{ vars.STAGING_URL }} --env REQUIRE_MANIFEST=${{ vars.STAGING_HAS_DATA == 'true' && '1' || '0' }} --summary-export=k6-summary.json
          disable-analytics: "true"

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-summary.json
          if-no-files-found: ignore
          retention-days: 30

  zap-baseline:
    name: OWASP ZAP baseline (staging)
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # the action files/updates a report issue
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          issue_title: ZAP baseline report (staging)
          fail_action: false
          allow_issue_writing: true
          cmd_options: -a
