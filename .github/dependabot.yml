# Weekly dependency updates (docs/06 §7). Minor/patch bumps are grouped per ecosystem to keep the
# PR queue reviewable; majors arrive individually. Security updates are not grouped or delayed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/staging
      - /infra/envs/prod
      - /infra/modules/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(infra)"
    groups:
      terraform-providers:
        patterns: ["*"]
