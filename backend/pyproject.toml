[project]
name = "stopwatch"
version = "0.1.0"
description = "Stop-level transit reliability: GTFS-Realtime ingestion, arrival inference, and rider-facing analytics."

license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.4",
    "boto3>=1.35",
    "fastapi>=0.115",
    "gtfs-realtime-bindings>=1.0.0",
    "httpx>=0.28",
    "mangum>=0.19",
    "protobuf>=5.28",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
# Analytics jobs only (schedule import, daily rollup, LAMP validation). Kept out of the API package.
jobs = ["duckdb>=1.1"]
# Web Push delivery (notify job).
alerts = ["pywebpush>=2.0"]
# "Ask Stopwatch" LLM feature.
ask = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "alembic>=1.14",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "moto[s3,ssm,awslambda]>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "types-protobuf>=5.28",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stopwatch"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit so tests never depend on the editable-install .pth (macOS can flag it hidden; Python 3.13 skips hidden .pth files).
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a Postgres database (TEST_DATABASE_URL)",
    "network: hits the live internet (skipped in CI)",
]

[tool.coverage.run]
source = ["stopwatch"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PL", "PTH", "DTZ"]
ignore = [
    "PLR0913",  # many-argument functions are fine for explicit dependency injection
    "PLR2004",  # magic values in tests and domain constants
    "S101",     # assert is used in tests
    "PLR0911", "PLR0912", "PLR0915",
    "PLR0917",  # positional args are fine for small internal helpers
    "PLC0415",  # lazy imports are deliberate: keep DuckDB/boto3/anthropic/pywebpush out of cold paths and the API zip
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ", "PTH"]
"migrations/**" = ["E501"]
# DuckDB SQL is composed from internal file paths, dates and constants (never user input); values that
# come from requests always go through SQLAlchemy bound parameters (enforced by Semgrep in CI).
"src/stopwatch/rollups/**" = ["S608"]
"src/stopwatch/catalog/gtfs_import.py" = ["S608"]
"src/stopwatch/alerts/evaluate.py" = ["S608"]
"src/stopwatch/jobs/lamp_validate.py" = ["S608"]
"src/stopwatch/platform/duck.py" = ["S608"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["stopwatch"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "stopwatch.core.*"
strict = true
